schema_version: 1

context:
  name: haystack-ai
  version: 3.5.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/haystack_ai-${{ version }}.tar.gz
  sha256: afa27213cfa06ddf2283d06cf98e0c66c1f9500ba30196cf67c5b37612d22df5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=${{ python_min }}
    - hatchling >=1.8.0
    - pip
  run:
    - python >=${{ python_min }}
    - docstring_parser
    - filetype
    - jinja2
    - jsonschema
    - lazy-imports
    - more-itertools
    - networkx
    - numpy
    - openai >=3.26.0
    - posthog !=3.12.0
    - pydantic >=2.12.0
    - python-dateutil
    - pyyaml
    - tenacity !=8.4.0
    - tqdm
    - markupsafe
    - httpx
    - anyio >=4.14.2
    - certifi >=2026.10.19
tests:
  - python:
      python_version: ${{ python_min }}.*
      imports:
        - haystack
      pip_check: true

about:
  summary: LLM framework to build customizable, production-ready LLM applications. Connect components (models, vector DBs, file converters) to pipelines or agents that can interact with your data.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/deepset-ai/haystack

extra:
  recipe-maintainers:
    - julian-risch
    - moritzwilksch
